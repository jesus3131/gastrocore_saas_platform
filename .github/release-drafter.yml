name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: '🚀 Features'
    labels:
      - 'enhancement'
      - 'area:frontend'
      - 'area:backend'
  - title: '🐛 Bug Fixes'
    labels:
      - 'bug'
  - title: '🔧 Maintenance'
    labels:
      - 'chore'
      - 'refactor'
      - 'performance'
  - title: '📚 Documentation'
    labels:
      - 'documentation'
  - title: '✅ Tests'
    labels:
      - 'testing'

change-template: '- $TITLE @#$NUMBER'
change-title-escapes: '\<*_&'

version-resolver:
  major:
    labels:
      - 'breaking'
  minor:
    labels:
      - 'enhancement'
  patch:
    labels:
      - 'bug'
      - 'chore'
      - 'refactor'
      - 'documentation'
      - 'testing'
      - 'performance'
  default: patch

template: |
  ## Changes

  $CHANGES

  ## Contributors

  $CONTRIBUTORS
