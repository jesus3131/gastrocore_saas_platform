name: Security Audit

on:
  schedule:
    - cron: '0 7 * * 1' # Every Monday at 07:00 UTC
  push:
    branches: [main]
    paths:
      - pnpm-lock.yaml
      - packages/backend/package.json
      - packages/frontend/package.json
      - packages/analytics/requirements.txt

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Run pnpm audit
        continue-on-error: true
        id: audit
        run: |
          pnpm audit --audit-level=high 2>&1 | tee audit-report.txt
          echo "has_issues=$([ -s audit-report.txt ] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
      - name: Create issue on critical vulnerabilities
        if: steps.audit.outputs.has_issues == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('audit-report.txt', 'utf8');
            const title = 'Security Audit: vulnerabilities found';
            const body = `## Security Audit Report\n\nVulnerabilities were detected in dependencies:\n\n\`\`\`\n${report.slice(0, 5000)}\n\`\`\`\n\nPlease review and update affected packages.`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['bug', 'priority:high'],
            });
