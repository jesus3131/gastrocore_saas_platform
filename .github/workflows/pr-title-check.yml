name: PR Title Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read
  statuses: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pattern = /^(feat|fix|chore|docs|style|refactor|perf|test|ci|revert)(\(.+\))?: .{1,100}$/;
            const title = context.payload.pull_request.title;

            if (!pattern.test(title)) {
              core.setFailed(
                `PR title "${title}" does not follow Conventional Commits.\n\n` +
                `Expected format: <type>(<scope>): <description>\n` +
                `Types: feat, fix, chore, docs, style, refactor, perf, test, ci, revert\n` +
                `Examples:\n` +
                `  feat(pos): add table split payment\n` +
                `  fix(inventory): correct stock deduction on order cancel\n` +
                `  chore(deps): upgrade prisma to 6.1.0`
              );
            }
