apiVersion: v1
kind: Service
metadata:
  name: restopro-analytics
  namespace: restopro
  labels:
    app.kubernetes.io/name: analytics
    app.kubernetes.io/part-of: restopro-enterprise
spec:
  selector:
    app: analytics
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics
  namespace: restopro
  labels:
    app.kubernetes.io/name: analytics
    app.kubernetes.io/part-of: restopro-enterprise
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: analytics
  template:
    metadata:
      labels:
        app: analytics
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: analytics
          image: ghcr.io/restopro/analytics:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: ANALYTICS_API_PREFIX
              value: /api/v1/analytics
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: gastrocore
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: restopro-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: restopro-secrets
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
